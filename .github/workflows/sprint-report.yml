name: Sprint Report – Geração Automática

on:
  # Executar de 2 em 2 semanas às 07:30 UTC (segunda-feira da semana ímpar)
  schedule:
    - cron: "30 7 * * 1"   # Todas as segundas-feiras; filtrado por semana no script
  # Permitir execução manual
  workflow_dispatch:
    inputs:
      sprint_label:
        description: "Identificador da sprint (ex: 2024-W01). Se vazio, gerado automaticamente."
        required: false
        default: ""
      team:
        description: "Nome exato da equipa a processar. Se vazio, processa todas."
        required: false
        default: ""

permissions:
  contents: write   # Para fazer commit dos relatórios gerados

jobs:
  generate-reports:
    name: Gerar Relatórios de Sprint
    runs-on: [self-hosted, windows, corp-network, reporting]

    steps:
      - name: Healthcheck – Conectividade ao Azure DevOps
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORGANIZATION: ${{ secrets.ADO_ORGANIZATION }}
        shell: pwsh
        run: |
          Write-Output "A verificar conectividade ao Azure DevOps..."
          if (-not $env:ADO_PAT) {
            Write-Output "::error::Secret ADO_PAT não está configurado. Configura o secret no repositório (Settings → Secrets → Actions)."
            exit 1
          }
          if (-not $env:ADO_ORGANIZATION) {
            Write-Output "::error::Secret ADO_ORGANIZATION não está configurado. Configura o secret no repositório."
            exit 1
          }
          try {
            $base64Pat = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:ADO_PAT"))
            $response = Invoke-WebRequest `
              -Uri "https://dev.azure.com/$env:ADO_ORGANIZATION/_apis/projects?api-version=7.1" `
              -Headers @{ Authorization = "Basic $base64Pat" } `
              -TimeoutSec 15 `
              -UseBasicParsing `
              -ErrorAction Stop
            $httpStatus = $response.StatusCode
          } catch {
            $httpStatus = $_.Exception.Response.StatusCode.value__
            if (-not $httpStatus) {
              Write-Output "::error::Sem conectividade ao Azure DevOps. Verifica se a VPN está ativa e o runner tem acesso à rede corporativa."
              exit 1
            }
          }
          if ($httpStatus -eq 200) {
            Write-Output "Conectividade ao Azure DevOps OK (HTTP $httpStatus)."
          } elseif ($httpStatus -eq 401 -or $httpStatus -eq 403) {
            Write-Output "::error::Falha de autenticação ao Azure DevOps (HTTP $httpStatus). Verifica se o ADO_PAT é válido e tem permissões suficientes."
            exit 1
          } else {
            Write-Output "::error::Resposta inesperada do Azure DevOps (HTTP $httpStatus). Verifica a conectividade e as credenciais."
            exit 1
          }

      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Instalar browsers Playwright
        shell: pwsh
        run: playwright install chromium

      - name: Executar testes
        run: pytest tests/ -v

      - name: Verificar se é semana de execução
        id: check_week
        shell: pwsh
        run: |
          $week = python -c "from datetime import datetime, timezone; d=datetime.now(timezone.utc); print(d.isocalendar()[1])"
          echo "week=$week" >> $env:GITHUB_OUTPUT
          if ([int]$week % 2 -eq 1) {
            echo "run=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "run=false" >> $env:GITHUB_OUTPUT
          }

      - name: Executar geração de relatórios
        if: steps.check_week.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORGANIZATION: ${{ secrets.ADO_ORGANIZATION }}
          ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INPUT_SPRINT_LABEL: ${{ github.event.inputs.sprint_label }}
          INPUT_TEAM: ${{ github.event.inputs.team }}
        shell: pwsh
        run: |
          $scriptArgs = @("--config", "config/config.yaml")
          if ($env:INPUT_SPRINT_LABEL) {
            $scriptArgs += @("--sprint-label", $env:INPUT_SPRINT_LABEL)
          }
          if ($env:INPUT_TEAM) {
            $scriptArgs += @("--team", $env:INPUT_TEAM)
          }
          python src/run_report.py @scriptArgs

      - name: Confirmar e publicar relatórios
        if: steps.check_week.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          $sprint = python -c "from datetime import datetime, timezone; d=datetime.now(timezone.utc); print(f'{d.year}-W{d.isocalendar()[1]:02d}')"
          $diff = git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "chore(reports): relatório sprint $sprint" }
          git push

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-reports-${{ github.run_id }}
          path: reports/
          retention-days: 90
